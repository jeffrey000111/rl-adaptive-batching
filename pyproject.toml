[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-batching"
version = "0.1.0"
description = "When does a learned batching policy beat tuned heuristics for ML inference serving?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
]
# Post-hoc CPU latency measurement (scripts/measure_cpu_latency.py).
measure = [
    "torch>=2.2",
    "transformers>=4.40",
]
plots = [
    "matplotlib>=3.7",
]
# Only needed to re-run the archived course-project code under legacy/.
legacy = [
    "gymnasium>=0.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN"]
